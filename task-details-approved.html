<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task details – Approved · SparkFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Inter only, everywhere (incl. form controls) */
*,*::before,*::after{font-family:Inter}
body{margin:0;font-family:Inter;color:#101828;background:#F5F7FA}
a{color:#0070FF;text-decoration:none}a:hover{color:#1E3A8A}
/* Breadcrumb (same as task-details.html) */
.sf-crumbs ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:13px;line-height:20px}
.sf-crumbs li{display:inline-flex;align-items:center;min-width:0}
.sf-crumb-link{display:inline-flex;align-items:center;gap:6px;margin-left:-6px;padding:2px 6px;border-radius:6px;color:#0070FF;font-weight:500;transition:background-color .15s ease}
.sf-crumb-link:hover{background:#EFF4FF;color:#0070FF}
.sf-crumb-link:focus-visible{outline:2px solid #0070FF;outline-offset:2px}
.sf-crumb-sep{color:#98A2B3}
.sf-crumb-text{color:#475467;font-weight:500}
.sf-crumb-current{color:#101828;font-weight:600}
/* Task summary card (same as task-details.html) */
.sf-taskhead{display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #E4E7EC;border-radius:14px}
.sf-taskhead-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid #F2F4F7}
.sf-taskhead-actions{display:flex;align-items:center;gap:8px;flex:none}
.sf-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 12px;border-radius:9px;border:1px solid #D0D5DD;background:#FFFFFF;font:inherit;font-size:13px;font-weight:600;color:#344054;cursor:pointer;transition:background-color .15s ease,border-color .15s ease}
.sf-btn:hover{background:#F9FAFB;border-color:#98A2B3}
.sf-btn:focus-visible{outline:2px solid #0070FF;outline-offset:2px}
.sf-btn--icon{width:36px;padding:0;font-size:18px;line-height:1}
.sf-taskhead-body{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;padding:14px 20px}
.sf-taskchips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sf-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:16px;padding:4px 10px;border-radius:999px}
@media (max-width:640px){.sf-taskhead-top,.sf-taskhead-body{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div id="dc-app" data-root="TaskGuidedApproved"></div>
<template data-dc-component="TaskGuidedApproved">
<div style="font-family: Inter; color: #101828; background: #F5F7FA">
  <dc-import name="TaskGuided" action-state="submitted" hint-size="100%,1200px"></dc-import>
</div>
</template>
<script type="text/x-dc" data-dc-component="TaskGuidedApproved">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
<template data-dc-component="TaskGuided">
<div style="position: relative; min-height: 1200px; display: flex; background: #F5F7FA; font-family: Inter; color: #101828">

  <!-- Left sidebar (shared: assets/app-shell.js) -->
  <dc-import name="AppSidebar" active="home"></dc-import>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column">
    <!-- Top header (shared: assets/app-shell.js) -->
    <dc-import name="AppTopbar" active="home" inset="{{false}}" title="Supervisor Review" as-h1="{{true}}"></dc-import>
    <div style="flex: 1; padding: 22px 32px 32px; display: flex; flex-direction: column; gap: 20px">

      <!-- Task summary: breadcrumb + actions, then status chips (same as task-details.html) -->
      <section class="sf-taskhead" aria-label="Task summary">
      <div class="sf-taskhead-top">
      <nav aria-label="Breadcrumb" class="sf-crumbs">
        <ol>
          <li><a href="home.html" class="sf-crumb-link"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>My tasks</a></li>
          <li class="sf-crumb-sep" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></li>
          <li><span class="sf-crumb-text">Permit To Work</span></li>
          <li class="sf-crumb-sep" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></li>
          <li><span class="sf-crumb-current" aria-current="page">INS0499</span></li>
        </ol>
      </nav>
        <div class="sf-taskhead-actions">
          <button type="button" class="sf-btn" style="border-color: #B2CCFF; background: #EFF4FF; color: #0070FF">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM17 11l2 2 4-4"/></svg>
            Reassign
          </button>
          <button type="button" class="sf-btn sf-btn--icon" aria-label="More actions">⋯</button>
        </div>
      </div>
      <div class="sf-taskhead-body">
        <div class="sf-taskchips">
          <span class="sf-chip" style="{{statusChipStyle}}">{{statusChip}}</span>
          <span class="sf-chip" style="background: #FFFAEB; color: #B54708">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></svg>
            Medium priority
          </span>
          <span class="sf-chip" style="background: #F2F4F7; color: #475467">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
            No due date
          </span>
        </div>
      </div>
      </section>

      <!-- Stepper -->
      <ol aria-label="Workflow progress" style="list-style: none; margin: 0; padding: 16px 20px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(max(170px, 22%), 1fr)); gap: 12px">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <li style="display: flex; gap: 10px; align-items: flex-start">
            <span style="{{s.badge}}">{{s.mark}}</span>
            <span style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 600">{{s.name}}</span>
              <span style="font-size: 12px; color: #475467">{{s.who}}</span>
            </span>
          </li>
        </sc-for>
      </ol>

      <div style="display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start">
        <!-- Main column -->
        <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

          <!-- Returned banner -->
          <sc-if value="{{act.returned}}" hint-placeholder-val="{{false}}">
            <div role="alert" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: #FFFAEB; border: 1px solid #FEC84B">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B54708" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
              <div style="font-size: 14px; line-height: 1.5; color: #7A2E0E"><strong>Returned to you by [HSE Officer] · [date]</strong><br>"[Reason, e.g. Gas test reading missing for zone B]"</div>
            </div>
          </sc-if>

          <!-- ACTION AREA (Option A) -->
          <section aria-label="Your action" style="{{act.cardStyle}}">
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="{{act.eyebrowStyle}}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{act.eyebrowIcon}}"/></svg>
                {{act.eyebrow}}
              </span>
              <span style="flex: 1"></span>
              <span style="font-size: 13px; font-weight: 600; color: #344054">{{act.count}}</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px">
              <h2 style="margin: 0; font-size: 20px; font-weight: 700">{{act.heading}}</h2>
              <span style="position: relative; display: inline-flex">
                <button onClick="{{toggleTip1}}" aria-label="About this step" aria-expanded="{{tip1}}" style="width: 32px; height: 32px; padding: 0; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
                  <span style="width: 20px; height: 20px; border-radius: 50%; background: #0070FF; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">?</span>
                </button>
                <sc-if value="{{tip1}}" hint-placeholder-val="{{false}}">
                  <span role="tooltip" style="position: absolute; top: 36px; left: -8px; z-index: 20; width: 320px; padding: 10px 12px; border-radius: 10px; background: #101828; color: #FFFFFF; font-size: 13px; font-weight: 400; line-height: 1.5; box-shadow: 0 8px 24px rgba(16,24,40,.24)">{{act.sub}}</span>
                </sc-if>
              </span>
            </div>
            <sc-if value="{{act.showBar}}" hint-placeholder-val="{{true}}">
              <div style="height: 6px; border-radius: 999px; background: #C7D7FE; overflow: hidden"><div style="{{act.bar}}"></div></div>
            </sc-if>
            <sc-for list="{{actRows}}" as="r" hint-placeholder-count="2">
              <div style="{{r.rowStyle}}">
                <span style="{{r.iconStyle}}">{{r.mark}}</span>
                <span style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                  <span style="{{r.titleStyle}}">{{r.title}}</span>
                  <span style="font-size: 12px; color: #475467">{{r.meta}}</span>
                  <sc-if value="{{r.prefilled}}" hint-placeholder-val="{{false}}"><span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: #F4F3FF; color: #5925DC">Pre-filled from contractor</span></sc-if>
                </span>
                <a href="review-workspace.html" style="{{r.btnStyle}}">{{r.label}}</a>
              </div>
            </sc-for>
            <sc-if value="{{act.ready}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 4px">
                <button onClick="{{approve}}" style="height: 48px; padding: 0 22px; border-radius: 10px; border: 0; background: #0070FF; font: inherit; font-size: 15px; font-weight: 700; color: #FFFFFF; cursor: pointer">Approve &amp; send to HSE</button>
                <button style="height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid #D0D5DD; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #344054; cursor: pointer">Send back to contractor</button>
                <span style="flex: 1"></span>
                <button style="height: 48px; padding: 0 12px; border-radius: 10px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #B42318; cursor: pointer">Reject permit</button>
              </div>
            </sc-if>
            <sc-if value="{{act.submitted}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 4px">
                <a href="home.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 22px; border-radius: 10px; background: #0070FF; font-size: 15px; font-weight: 700; color: #FFFFFF">Next task →</a>
                <a href="home.html" style="display: inline-flex; align-items: center; height: 48px; padding: 0 18px; border-radius: 10px; border: 1px solid #D0D5DD; background: #FFFFFF; font-size: 15px; font-weight: 600; color: #344054">Back to My tasks</a>
                <span style="flex: 1"></span>
                <button onClick="{{undo}}" style="height: 48px; padding: 0 14px; border-radius: 10px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #0070FF; cursor: pointer">Undo · 0:09</button>
              </div>
            </sc-if>
          </section>

          <!-- Supervisor Review: your filled-in values -->
          <sc-if value="{{rv.show}}" hint-placeholder-val="{{false}}">
            <section aria-label="Supervisor Review – your entries" style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 18px">
              <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
                <button onClick="{{toggleRv}}" aria-expanded="{{rvOpen}}" aria-label="Show or hide Supervisor Review entries" style="width: 36px; height: 36px; flex: none; padding: 0; border-radius: 9px; border: 1px solid #D0D5DD; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #344054">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{rvChevron}}"></path></svg>
                </button>
                <div style="flex: 1 1 260px">
                  <h2 style="margin: 0; font-size: 18px; font-weight: 700">Supervisor Review</h2>
                  <div style="font-size: 13px; color: #475467; margin-top: 4px">{{rv.meta}}</div>
                </div>
                <sc-if value="{{rv.editable}}" hint-placeholder-val="{{true}}">
                  <a href="review-workspace.html" style="display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid #B2CCFF; background: #EFF4FF; font-size: 14px; font-weight: 600; color: #0070FF">Edit entries →</a>
                </sc-if>
              </div>

              <sc-if value="{{rvOpen}}" hint-placeholder-val="{{true}}">
              <!-- Permit to work -->
              <div style="display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
                  <h3 style="margin: 0; font-size: 15px; font-weight: 700">Permit to work</h3>
                  <span style="font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: #ECFDF3; color: #067647">✓ Confirmed</span>
                </div>
                <dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 24px; padding: 16px; border-radius: 12px; background: #F9FAFB">
                  <sc-for list="{{rv.permit}}" as="p" hint-placeholder-count="6">
                    <div><dt style="font-size: 12px; color: #5D6679">{{p.k}}</dt><dd style="margin: 3px 0 0; font-size: 14px; font-weight: 500">{{p.v}}</dd></div>
                  </sc-for>
                </dl>
              </div>

              <!-- Hazard & safety checklist -->
              <div style="display: flex; flex-direction: column; gap: 10px">
                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
                  <h3 style="margin: 0; font-size: 15px; font-weight: 700">Hazard &amp; safety checklist</h3>
                  <span style="{{rv.checkChipStyle}}">{{rv.checkChip}}</span>
                </div>
                <div style="border: 1px solid #EEF0F3; border-radius: 12px; overflow: hidden">
                  <sc-for list="{{rv.answers}}" as="a" hint-placeholder-count="6">
                    <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; border-bottom: 1px solid #EEF0F3">
                      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
                        <span style="flex: 1 1 260px; font-size: 14px; color: #101828">{{a.n}}. {{a.text}}</span>
                        <span style="{{a.style}}">{{a.label}}</span>
                      </div>
                      <sc-if value="{{a.note}}" hint-placeholder-val="{{false}}">
                        <div style="font-size: 13px; color: #912018; padding: 8px 10px; border-radius: 8px; background: #FEF3F2">Note to contractor: {{a.note}}</div>
                      </sc-if>
                    </div>
                  </sc-for>
                </div>
              </div>
              </sc-if>
            </section>
          </sc-if>

          <section aria-label="Contractor's request" style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 16px">
            <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
              <button onClick="{{toggleCr}}" aria-expanded="{{crOpen}}" aria-label="Show or hide Contractor's request" style="width: 36px; height: 36px; flex: none; padding: 0; border-radius: 9px; border: 1px solid #D0D5DD; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #344054">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{crChevron}}"></path></svg>
              </button>
              <div style="flex: 1 1 260px">
                <div style="display: flex; align-items: center; gap: 6px">
                  <h2 style="margin: 0; font-size: 18px; font-weight: 700">Contractor's request</h2>
                  <span style="position: relative; display: inline-flex">
                    <button onClick="{{toggleTip2}}" aria-label="About these fields" aria-expanded="{{tip2}}" style="width: 32px; height: 32px; padding: 0; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
                      <span style="width: 20px; height: 20px; border-radius: 50%; background: #0070FF; color: #FFFFFF; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">?</span>
                    </button>
                    <sc-if value="{{tip2}}" hint-placeholder-val="{{false}}">
                      <span role="tooltip" style="position: absolute; top: 36px; left: -8px; z-index: 20; width: 300px; padding: 10px 12px; border-radius: 10px; background: #101828; color: #FFFFFF; font-size: 13px; font-weight: 400; line-height: 1.5; box-shadow: 0 8px 24px rgba(16,24,40,.24)">Key fields shown here so you can review without leaving the page. Admins choose which fields appear.</span>
                    </sc-if>
                  </span>
                </div>
                <div style="font-size: 13px; color: #475467; margin-top: 4px">Contractor PTW Request · submitted 19 Oct 2026 by sreekutty</div>
              </div>
              <button onClick="{{openDrawer}}" style="height: 40px; padding: 0 14px; border-radius: 9px; border: 1px solid #B2CCFF; background: #EFF4FF; font: inherit; font-size: 14px; font-weight: 600; color: #0070FF; cursor: pointer">Open full form →</button>
            </div>
            <sc-if value="{{crOpen}}" hint-placeholder-val="{{true}}">
              <dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px 24px; padding: 16px; border-radius: 12px; background: #F9FAFB">
                <sc-for list="{{summary}}" as="k" hint-placeholder-count="6">
                  <div><dt style="font-size: 12px; color: #5D6679">{{k.k}}</dt><dd style="margin: 3px 0 0; font-size: 14px; font-weight: 500">{{k.v}}</dd></div>
                </sc-for>
              </dl>
            </sc-if>
          </section>

          <section aria-label="Discussion" style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 12px">
            <h2 style="margin: 0; font-size: 18px; font-weight: 700">Discussion</h2>
            <label style="display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 13px; color: #475467">Ask the contractor or HSE a question — they'll be notified</span>
              <textarea rows="3" placeholder="Write a comment… use @ to mention someone" style="font: inherit; font-size: 14px; padding: 12px; border: 1px solid #D0D5DD; border-radius: 10px; resize: vertical"></textarea>
            </label>
            <div style="display: flex; justify-content: flex-end"><button style="height: 40px; padding: 0 16px; border-radius: 9px; border: 0; background: #EFF4FF; color: #0070FF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Post comment</button></div>
          </section>
        </div>

        <!-- Right rail -->
        <div style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
          <section aria-label="Details" style="background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
            <h2 style="margin: 0; font-size: 16px; font-weight: 700">Details</h2>
            <dl style="margin: 0; display: flex; flex-direction: column; gap: 12px">
              <sc-for list="{{details}}" as="d" hint-placeholder-count="5">
                <div style="display: flex; justify-content: space-between; gap: 12px">
                  <dt style="font-size: 13px; color: #5D6679">{{d.k}}</dt>
                  <dd style="{{d.style}}">{{d.v}}</dd>
                </div>
              </sc-for>
            </dl>
          </section>
        </div>
      </div>
    </div>

    <!-- Sticky action bar -->
    <div style="position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 32px; background: #FFFFFF; border-top: 1px solid #E4E7EC; box-shadow: 0 -4px 12px rgba(16,24,40,.05)">
      <span style="flex: 1 1 260px; font-size: 14px; color: #475467">{{act.barHint}}</span>
      <sc-if value="{{act.barSecondary}}" hint-placeholder-val="{{true}}">
        <button style="height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #D0D5DD; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #344054; cursor: pointer">{{act.barSecondary}}</button>
      </sc-if>
      <sc-if value="{{act.barPrimary}}" hint-placeholder-val="{{true}}">
        <button disabled style="height: 44px; padding: 0 20px; border-radius: 10px; border: 0; background: #C7D7FE; font: inherit; font-size: 14px; font-weight: 600; color: #1E3A8A; cursor: not-allowed">{{act.barPrimary}}</button>
      </sc-if>
    </div>
  </main>

  <!-- Full form: slide-over panel -->
  <sc-if value="{{drawerOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: fixed; inset: 0; z-index: 60; display: flex; justify-content: flex-end; background: rgba(16,24,40,.45); overscroll-behavior: contain">
      <button onClick="{{closeDrawer}}" aria-label="Close full form" style="flex: 1; border: 0; background: transparent; cursor: pointer"></button>

        { k: 'End', v: '[Date, time]' }, { k: 'Contractor company', v: '[Company]' }, { k: 'Crew size', v: '[n]' }
      ],
      checkChip: answeredN < RQ.length ? `${answeredN} of ${RQ.length} answered` : `✓ ${RQ.length} of ${RQ.length} answered · 2 marked No`,
      checkChipStyle: 'font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;' + (answeredN < RQ.length ? 'background:#EFF4FF;color:#0070FF' : 'background:#ECFDF3;color:#067647'),
      answers: RQ.map((text, i) => {
        const a = i < answeredN ? RA[i] : null;
        return { n: i + 1, text, label: a ? ansLook[a[0]][0] : 'Not answered', style: a ? ansLook[a[0]][1] : pill + 'background:#FFFFFF;border:1px dashed #98A2B3;color:#475467', note: a && a[1] ? a[1] : '' };
      })
    };

    const rvOpen = this.state.rvOpen ?? false, crOpen = this.state.crOpen ?? false;
    const chevDown = 'm6 9 6 6 6-6', chevRight = 'm9 6 6 6-6 6';

    return { rv, statusChip, statusChipStyle,
      rvOpen, crOpen, rvChevron: rvOpen ? chevDown : chevRight, crChevron: crOpen ? chevDown : chevRight,
      toggleRv: () => this.setState({ rvOpen: !rvOpen }), toggleCr: () => this.setState({ crOpen: !crOpen }),
      tip1: !!this.state.tip1, tip2: !!this.state.tip2,
      toggleTip1: () => this.setState({ tip1: !this.state.tip1, tip2: false }),
      toggleTip2: () => this.setState({ tip2: !this.state.tip2, tip1: false }),
      nav, steps, forms, summary, details, activity, sections, hideEmpty, drawerOpen, act, actRows,
      approve: go('submitted'), undo: go('ready'),
      openDrawer: () => this.setState({ drawer: true }),
      closeDrawer: () => this.setState({ drawer: false, asking: null }),
      toggleEmpty: () => this.setState({ hideEmpty: !hideEmpty }) };
  }
}
</script>
